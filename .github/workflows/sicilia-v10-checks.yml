name: SICILIA 3D v10 checks
on:
  push:
    paths:
      - 'v10/**'
      - '.github/workflows/sicilia-v10-checks.yml'
  pull_request:
    paths:
      - 'v10/**'
  workflow_dispatch:
jobs:
  v10-geometry-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: v10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax and geography
        run: npm run check
