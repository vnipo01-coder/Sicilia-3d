<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#092535">
<meta name="description" content="SICILIA 3D – Geografischer Atlas Siziliens mit 3D-Gelände, Orten, Wetter, Gebäudeinformationen, begehbarem Dorfmodell und 3D-Flugzeugen.">
<title>SICILIA 3D | Digital Island Explorer v8</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.6.2/dist/maplibre-gl.css">
<link rel="stylesheet" href="./atlas.css?v=91">
</head>
<body>
<main id="map" role="application" aria-label="Interaktive 3D-Karte von Sizilien"></main>
<header class="top">
  <div class="brand glass"><strong>SICILIA <em>3D</em></strong><small>DIGITAL ISLAND EXPLORER · V9</small></div>
  <div class="quicksearch glass">
    <input id="search" type="search" placeholder="Stadt, Dorf, Piazza oder Strasse …" aria-label="Ort suchen">
    <button id="search-go" aria-label="Suchen">⌕</button>
  </div>
  <div class="toplinks">
    <a href="./walk.html" id="walk-launch" class="glass" title="Begehbare 3D-Umgebung an der aktuellen Kartenposition">🚶 Walk hier</a>
    <a href="./airport.html" class="glass" title="Flugzeuge und Catania in 3D">✈️ Air</a>
  </div>
</header>
<div id="status" class="status glass" role="status">Lade Sizilien …</div>
<div id="legend" class="glass" hidden>🏔️ 3D-Relief</div>
<nav class="fab glass" id="dock" aria-label="Kartenmenü">
  <button data-pane="discover" type="button"><span>🧭</span>Orte</button>
  <button data-pane="layers" type="button"><span>🗺️</span>Karte</button>
  <button data-pane="knowledge" type="button"><span>📖</span>Wissen</button>
  <button data-pane="weather" type="button"><span>🌦️</span>Wetter</button>
  <button data-pane="flights" type="button"><span>✈️</span>Flüge</button>
</nav>
<section class="drawer glass" id="drawer" aria-label="Karteninformationen" hidden>
  <div class="drawer-head"><h2 id="drawer-title">SICILIA 3D</h2>
  <button id="drawer-close" class="iconbtn" aria-label="Menü schliessen">×</button></div>
  <div id="drawer-content"></div>
</section>
<div style="display:none"><button id="quick-casalvecchio">Casalvecchio</button><button id="quick-piazza">Piazza Chiesa</button></div>
<script src="https://unpkg.com/maplibre-gl@5.6.2/dist/maplibre-gl.js"></script>
<script src="./atlas.js?v=91"></script>
</body>
</html>
